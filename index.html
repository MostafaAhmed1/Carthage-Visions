<!doctype html>
<html lang="ar" dir="rtl" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <meta name="theme-color" content="#14110e" />
    <meta name="format-detection" content="telephone=no" />
    <title>قرطاج فيجن — أنظمة كاميرات المراقبة في سلطنة عُمان</title>
    <meta
      name="description"
      content="تركيب أنظمة كاميرات مراقبة احترافية للمنازل والمحلات والمزارع في عُمان. زيارة معاينة مجانية، تركيب وتشغيل، وضمان. تواصل معنا واتساب أو اتصل بنا."
    />
    <link rel="preload" as="image" href="/images/hero-poster.jpg" fetchpriority="high" />
    <script>
      // Apply the stored language before first paint to avoid an RTL/LTR flash.
      (function () {
        try {
          var stored = localStorage.getItem('cv.lang');
          var lang = stored === 'en' || stored === 'ar' ? stored : 'ar';
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
